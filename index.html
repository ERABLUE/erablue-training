<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Technical ERABLUE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header-container">
        <img src="asset/dashboard/Logo/Logo_ERABLUE.webp" alt="Logo ERABLUE" class="logo-brand">
        <h1 class="main-title">Technical ERABLUE</h1>
    </header>

    <div id="Dashboard" class="tab-content" style="display: block;">
        <h2 class="section-title">Himbauan & Informasi Operasional</h2>
        <div class="card-box" onclick="toggleCard('detailSeragam')">
            <h3 class="card-title">Standar Uniform & Penampilan</h3>
            <span class="toggle-icon"><i class="fa-solid fa-chevron-down"></i></span>
        </div>
        <div id="detailSeragam" class="dropdown-detail" style="display: none;">
            <p class="card-desc">Pastikan seragam rapi sesuai standar profesionalitas Erablue.</p>
            <div class="teknisi-full-container">
                <img src="asset/dashboard/kelengkapan_seragam/Foto_SOP_Seragam.webp" alt="SOP" class="teknisi-img">
                <div class="k3-clickable-dot" onclick="showK3Modal('Rambut', 'Rambut rapi tidak menutupi mata.', 'asset/dashboard/kelengkapan_seragam/Foto_SOP_Seragam_Rambut.webp')" style="top: 15%; left: 50%;">
                    <i class="fa-solid fa-head-side-mask"></i>
                </div>
                <div class="k3-clickable-dot" onclick="showK3Modal('Atribut', 'Seragam bersih dan logo terlihat jelas.', 'asset/dashboard/kelengkapan_seragam/Foto_SOP_Seragam_Logo.webp')" style="top: 35%; left: 40%;">
                    <i class="fa-solid fa-shirt"></i>
                </div>
                <div class="k3-clickable-dot" onclick="showK3Modal('Sepatu', 'Gunakan sepatu safety standar.', 'asset/dashboard/kelengkapan_seragam/Foto_SOP_Seragam_Sepatu.webp')" style="top: 85%; left: 50%;">
                    <i class="fa-solid fa-shoe-prints"></i>
                </div>
            </div>
        </div>
    </div>

    <div id="SmartLibrary" class="tab-content" style="display:none;">
        <h2 class="section-title">Smart Library</h2>
        <div class="search-group">
            <select id="libCategory" class="search-input">
                <option value="">Semua Kategori</option>
                <option value="AC">AC</option>
                <option value="TV">TV</option>
                <option value="KULKAS">KULKAS</option>
                <option value="MESIN CUCI">MESIN CUCI</option>
            </select>
            <input type="text" id="libSearch" class="search-input" placeholder="Cari Merk atau Seri (Contoh: LG)">
            <button class="btn-action" onclick="cariLibrary()">Cari Dokumen</button>
        </div>
        <div id="libResult" class="result-box"></div>
    </div>

    <div id="Helper" class="tab-content" style="display:none;">
        <h2 class="section-title">Troubleshooting</h2>
        <div class="search-group">
            <input type="text" id="helperSN" class="search-input" placeholder="Input Serial Number">
            <input type="text" id="helperError" class="search-input" placeholder="Input Kode Error (Contoh: C4)">
            <button class="btn-action" onclick="cariError()">Cari Solusi</button>
        </div>
        <div id="helperResult" class="result-box"></div>
    </div>

    <div id="Leaderboard" class="tab-content" style="display:none;">
        <h2 class="section-title">Leaderboard</h2>
        <div class="podium-wrapper">
            <div class="podium-item silver">
                <div class="podium-card" id="rank2">
                    <span class="rank-id">--</span>
                    <span class="rank-score" style="display:none;">--</span>
                </div>
                <div class="step">2</div>
            </div>
            <div class="podium-item gold">
                <div class="podium-card" id="rank1">
                    <span class="rank-id">--</span>
                    <span class="rank-score" style="display:none;">--</span>
                </div>
                <div class="step">1</div>
            </div>
            <div class="podium-item bronze">
                <div class="podium-card" id="rank3">
                    <span class="rank-id">--</span>
                    <span class="rank-score" style="display:none;">--</span>
                </div>
                <div class="step">3</div>
            </div>
        </div>
        <div class="rank-categories">
            <button class="cat-btn active" onclick="setRankCategory('totalUnit', this)">Keseluruhan</button>
            <button class="cat-btn" onclick="setRankCategory('ac', this)">AC</button>
            <button class="cat-btn" onclick="setRankCategory('kulkas', this)">Kulkas</button>
            <button class="cat-btn" onclick="setRankCategory('tv', this)">TV</button>
            <button class="cat-btn" onclick="setRankCategory('mesinCuci', this)">Mesin Cuci</button>
        </div>
        <div id="rankList" class="rank-list-container"></div>
    </div>

    <div id="Personal" class="tab-content" style="display:none;">
        <h2 class="section-title">Akun Saya</h2>
        <div class="auth-container">
            <input type="number" class="search-input" placeholder="ID Staf">
            <button class="btn-action">Sign In</button>
        </div>
    </div>

    <nav class="navbar">
        <button class="tab-link active" onclick="bukaTab(event, 'Dashboard')"><i class="fa-solid fa-house"></i><span>Home</span></button>
        <button class="tab-link" onclick="bukaTab(event, 'SmartLibrary')"><i class="fa-solid fa-book"></i><span>Library</span></button>
        <button class="tab-link" onclick="bukaTab(event, 'Helper')"><i class="fa-solid fa-screwdriver-wrench"></i><span>Helper</span></button>
        <button class="tab-link" onclick="bukaTab(event, 'Leaderboard')"><i class="fa-solid fa-trophy"></i><span>Rank</span></button>
        <button class="tab-link" onclick="bukaTab(event, 'Personal')"><i class="fa-solid fa-user"></i><span>User</span></button>
    </nav>

    <div id="k3Modal" class="modal-wrapper" style="display: none;" onclick="tutupK3Modal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="tutupK3Modal()">&times;</span>
            <h3 id="modalTitle"></h3>
            <img id="modalImg" src="" class="modal-img">
            <p id="modalDesc"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
